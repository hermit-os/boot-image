[package]
name = "boot_image"
version = "0.1.0"
authors = ["Stefan Lankes <slankes@eonerc.rwth-aachen.de>"]
edition = "2021"
license = "MIT/Apache-2.0"
readme = "README.md"
keywords = ["operating systems", "kernel"]
categories = ["os"]
repository = "https://github.com/hermit-os/boot-image"
description = "Extend HermitOS` kernel to a common monolithic operting system."

[dependencies]
hermit-kernel = { path = "./kernel", default-features = false }
log = { version = "0.4", default-features = false }
goblin = { version = "0.8", default-features = false, features = ["elf32", "elf64", "endian_fd"] }
align-address = "0.1"
num = { version = "0.4", default-features = false }

[features]
default = ["pci", "pci-ids", "fsgsbase", "smp", "tcp", "udp", "dns", "acpi", "common-os", "fuse", "dhcpv4"]
common-os = ["hermit-kernel/common-os"]
vga = ["hermit-kernel/vga"]
pci = ["hermit-kernel/pci"]
pci-ids = ["hermit-kernel/pci-ids"]
acpi = ["hermit-kernel/acpi"]
fsgsbase = ["hermit-kernel/fsgsbase"]
smp = ["hermit-kernel/smp"]
fuse = ["hermit-kernel/fuse"]
tcp = ["hermit-kernel/tcp"]
udp = ["hermit-kernel/udp"]
dns = ["hermit-kernel/dns"]
dhcpv4 = ["hermit-kernel/dhcpv4"]

[patch.crates-io]
# We need https://github.com/rust-osdev/volatile/pull/61
volatile = { git = "https://github.com/rust-osdev/volatile.git" }
